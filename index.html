<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasty Bites</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Tasty Bites</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#menu">Menu</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home">
    <h2>Welcome to Tasty Bites</h2>
    <p>Your favorite place for delicious meals.</p>
  </section>

  <section id="menu">
    <h2>Menu</h2>
    <div class="menu-item">
      <h3>Margherita Pizza</h3>
      <p>Classic delight with fresh tomatoes and mozzarella.</p>
    </div>
    <div class="menu-item">
      <h3>Veg Burger</h3>
      <p>Grilled patty with lettuce, tomato, and cheese.</p>
    </div>
  </section>

  <section id="contact">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send</button>
    </form>
    <p id="responseMessage"></p>
  </section>

  <footer>
    <p>&copy; 2025 Tasty Bites</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
